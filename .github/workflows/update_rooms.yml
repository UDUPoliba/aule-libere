name: Aggiorna Database Aule

on:
  push:
    paths:
      - 'orari_scraped.json'
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-aggregate:
    runs-on: ubuntu-latest
    env:
      TZ: "Europe/Rome"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installa dipendenze Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Installa Chromium e dipendenze essenziali
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libnss3 libgbm1 libasound2t64
          python -m playwright install chromium

      - name: Scarica orari_scraped.json da repo privato
        env:
          GITHUB_TOKEN: ${{ secrets.UDU_HUB_TOKEN }}
        run: |
          curl -H "Authorization: Bearer $GITHUB_TOKEN" \
               -H "Accept: application/vnd.github.v3.raw" \
               -sSL "https://api.github.com/repos/UDUBari/udubari-website/contents/orari_scraped.json" \
               -o orari_scraped.json

      - name: Esegui aggregatore e scraper
        env:
          TZ: "Europe/Rome"
        run: |
          python up_aggregator.py

      - name: Commit e Push dei dati aggiornati
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add up_archive.json up_rooms_db.json orari_scraped.json
          
          if git diff --staged --quiet; then
            echo "Nessuna modifica rilevata nel database aule."
          else
            git commit -m "chore(data): auto-update database aule da orari_scraped.json [skip ci]"
            git push
          fi